name: Bug report
description: 报告可以稳定复现的问题
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿粘贴 API 密钥、私人对话或未授权角色素材。
  - type: input
    id: version
    attributes:
      label: Hikari 版本
      placeholder: 例如 v0.1.0 或 commit SHA
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: 操作系统
      options: [Windows 11, Windows 10, macOS, Linux, 其他]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 按顺序列出操作步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已经移除密钥、私人对话和其他敏感信息
          required: true
