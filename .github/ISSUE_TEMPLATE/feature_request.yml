name: Feature request
description: 提议新的角色、模型、语音、记忆或工具能力
title: "[Feature]: "
labels: ["enhancement", "needs-discussion"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述用户场景，而不只是某项技术。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 功能领域
      options: [角色与形象, 对话与模型, 语音, 记忆, 工具与权限, 插件, 界面, 文档, 其他]
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: 数据和权限影响
      description: 它会读取、保存、上传或修改什么？用户如何撤销？
  - type: checkboxes
    id: scope
    attributes:
      label: 检查
      options:
        - label: 我已经搜索现有 Issue 和路线图
          required: true
        - label: 这个建议不要求绕过用户确认或操作系统权限
          required: true
